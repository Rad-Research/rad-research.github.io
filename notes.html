<script src="assets/js/articles.js"></script>
<script>
  (function () {
    const root = document.getElementById("articlesList");
    if (!root || !window.ARTICLES) return;

    const items = [...window.ARTICLES].sort((a, b) => (a.date < b.date ? 1 : -1));

    root.innerHTML = items.map((a) => `
      <article class="card reveal in">
        <p class="meta">${a.date} • ${a.readTime}</p>
        <h3>${a.title}</h3>
        <p>${a.excerpt}</p>
        <div class="tag-row">
          ${a.tags.map((t) => `<span>${t}</span>`).join("")}
        </div>
        <a class="card-link" href="${a.href}">Lire l'article</a>
      </article>
    `).join("");
  })();
</script>
